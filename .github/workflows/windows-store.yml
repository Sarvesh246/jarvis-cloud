name: Microsoft Store

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['web/desktop/**', '.github/workflows/windows-store.yml']

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: write
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
          key: store-${{ matrix.target }}
      - run: npm ci
        working-directory: web
      - name: Build unsigned Store package
        shell: pwsh
        run: ./web/desktop/package-msix.ps1 -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: Vaelo-Store-${{ matrix.architecture }}
          path: web/src-tauri/target/msix/*.msix
          if-no-files-found: error
      - name: Attach Store packages to the desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Get-ChildItem -LiteralPath web/src-tauri/target/msix -Filter '*.msix' | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not attach the Store package.' }
          }
