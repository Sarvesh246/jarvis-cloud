name: Microsoft Store

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['web/desktop/**', '.github/workflows/windows-store.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
          key: store-${{ matrix.target }}
      - run: npm ci
        working-directory: web
      - name: Build unsigned Store package
        shell: pwsh
        run: ./web/desktop/package-msix.ps1 -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: Vaelo-Store-${{ matrix.architecture }}
          path: web/src-tauri/target/msix/*.msix
          if-no-files-found: error
  attach:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Vaelo-Store-*
          path: store-packages
          merge-multiple: true
      - name: Attach Store packages to the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" store-packages/*.msix --clobber
