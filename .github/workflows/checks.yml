name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual pinned production image
        run: docker build --progress=plain --tag vaelo-ci .
      - name: Verify both runtimes and confinement inside the production image
        run: |
          docker run --rm --entrypoint /opt/jarvis/verification-env/bin/python vaelo-ci -c "import sys; sys.path.insert(0,'/opt/jarvis'); from verification import verify; assert verify({'source':'const result=17*23;', 'tests':'if(result!==391) throw Error(\"bad result\");'},language='javascript')['status']=='passed'; assert verify({'source':'value=17*23', 'tests':'assert value==391'})['status']=='passed'; assert verify({'source':'open(\"/etc/passwd\").read()', 'tests':'assert True'})['status']=='failed'; print('Production image: Python, JavaScript and confinement passed.')"
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp2
      - run: python -m pip install -r cloud/requirements-verification.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q cloud
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run evaluate
      - run: node --test ../deploy/freellmapi/bootstrap.test.mjs
      - run: npm run build
