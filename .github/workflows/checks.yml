name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp2
      - run: python -m pip install -r cloud/requirements-verification.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q cloud
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run evaluate
      - run: node --test ../deploy/freellmapi/bootstrap.test.mjs
      - run: npm run build
