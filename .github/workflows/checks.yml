name: Checks

on:
  push:
    branches: [main, 'fix/benchmark-regressions-*']
  pull_request:

permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual pinned production image
        run: docker build --progress=plain --tag vaelo-ci .
      - name: Verify both runtimes and confinement inside the production image
        run: |
          docker run --rm --entrypoint /opt/jarvis/verification-env/bin/python vaelo-ci /opt/jarvis/check_verification_runtime.py
      - name: Verify uploaded pixels and vision cache as the actual gateway user
        run: docker run --rm vaelo-ci /opt/hermes/.venv/bin/python /opt/jarvis/check_vision_runtime.py
      - name: Verify weather reference cache as the actual gateway user
        run: docker run --rm vaelo-ci /opt/hermes/.venv/bin/python /opt/jarvis/check_weather_runtime.py
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp2
      - run: python -m pip install -r cloud/requirements-verification.txt Pillow==12.1.1 coverage ruff
      - run: python -m coverage run --source=cloud -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m compileall -q cloud
      - run: ruff check --select E9,F63,F7,F82 cloud tests
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run evaluate
      - run: npm test --prefix ../deploy/freellmapi
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editing-ui
      - run: npm run test:offline-ui
      - run: npm run test:table-ui
